# Bundle patch: swap the in-tree workspace UI for this standalone plugin.
# Declared by `dsh.bundle.patch`, so DSH applies it as a profile layer whenever
# this package is installed as a bundle.
#
# Replace the existing `ui-workspace` row in place. Do not disable that row and
# insert a second id: a profile that then disables only the inserted id leaves
# no package providing `ctx.uiWorkspace`, and the web client boot times out
# waiting for it. Load this plugin or @deepseek-ai/dsh-client-ui-workspace,
# never both — they claim the same slots, locale namespace, and service.
- id: ui-workspace
  name: '@deepseek-ai/dsh-client-ui-workspace-browser'
