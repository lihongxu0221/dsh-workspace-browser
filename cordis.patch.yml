# Bundle patch: swap the in-tree workspace UI for this standalone plugin.
# Declared by `dsh.bundle.patch`, so DSH applies it as a profile layer whenever
# this package is installed as a bundle.
#
# Disable the stock row and insert this package under its own id. A `name`
# override on `ui-workspace` does not swap the package: the include loader
# treats `name` as an identity check and skips the whole patch on mismatch,
# so the stock browser keeps running and this plugin's Recents, project
# editor, and source folders never mount.
#
# The inserted row must stay enabled while this bundle is selected. Disabling
# only `ui-workspace-browser` leaves nobody providing `ctx.uiWorkspace`.
- id: ui-workspace
  disabled: true

- insert:
    - id: ui-workspace-browser
      name: '@deepseek-ai/dsh-client-ui-workspace-browser'
